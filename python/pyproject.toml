[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inharmonic"
version = "0.1.0"
description = "Python bindings and analysis tools for the Inharmonic piano model"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile",
]

[tool.setuptools.packages.find]
include = ["inharmonic*"]
